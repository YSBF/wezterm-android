[package]
name = "config"
version = "0.1.0"
authors = ["Wez Furlong <wez@wezfurlong.org>"]
edition = "2018"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dev-dependencies]
env_logger.workspace = true

[features]
default = ["ssh"]
distro-defaults = []

# Parse ~/.ssh/config to auto-generate SSH domains.
#
# This is the only thing `config` uses wezterm-ssh for, and because
# everything depends on `config` it pulls openssl, libssh and libssh2 into
# anything that only wanted to read wezterm.lua. Turning it off makes
# `Config::ssh_domains()` return only what the config file declares.
ssh = ["dep:wezterm-ssh"]

[dependencies]
anyhow.workspace = true
bitflags.workspace = true
colorgrad.workspace = true
dirs-next.workspace = true
enum-display-derive.workspace = true
hostname.workspace = true
lazy_static.workspace = true
libc.workspace = true
log.workspace = true
luahelper.workspace = true
mlua = {workspace=true, features=["vendored", "lua54", "async", "send", "serialize"]}
notify.workspace = true
ordered-float = { workspace=true, features = ["serde"] }
portable-pty = { workspace=true, features = ["serde_support"]}
promise.workspace = true
serde = {workspace=true, features = ["rc", "derive"]}
serde_json.workspace = true
shlex.workspace = true
smol.workspace = true
termwiz = { workspace=true, features=["use_serde"] }
toml.workspace = true
umask.workspace = true
wezterm-bidi.workspace = true
wezterm-config-derive.workspace = true
wezterm-dynamic.workspace = true
wezterm-input-types.workspace = true
wezterm-ssh = { workspace = true, optional = true }
wezterm-term = { workspace = true, features=["use_serde"] }

[target."cfg(unix)".dependencies]
nix = {workspace=true, features=["resource"]}

[target."cfg(windows)".dependencies]
winapi = { workspace=true, features = ["winuser"]}
