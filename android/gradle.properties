org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# The ABIs to build. arm64-v8a alone keeps the APK to one copy of a large
# native library; add armeabi-v7a and x86_64 once the arm64 build is proven.
wezterm.abis=arm64-v8a

# The minimum API level. 28 is what the cross-compile is pinned to, and is also
# the last release before the W^X restriction that shapes where a bundled shell
# has to live -- see docs/android-port-plan.md.
wezterm.minSdk=28
