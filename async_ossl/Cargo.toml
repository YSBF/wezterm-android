[package]
name = "async_ossl"
version = "0.1.0"
authors = ["Wez Furlong <wez@wezfurlong.org>"]
edition = "2018"
resolver = "2"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-io.workspace = true

[target.'cfg(not(any(windows, target_os="macos", target_os="android")))'.dependencies]
openssl.workspace = true

# Platforms with no system openssl to link against. Note that
# [workspace.dependencies] cannot itself be made target-conditional, so the cfg
# has to live here in the consuming crate; because the workspace uses
# resolver = "2", enabling openssl/vendored here turns on openssl-sys/vendored
# for these targets only, which in turn satisfies libssh-rs-sys and libssh2-sys.
[target.'cfg(any(windows, target_os="macos", target_os="android"))'.dependencies]
openssl = { workspace = true, features=["vendored"] }

