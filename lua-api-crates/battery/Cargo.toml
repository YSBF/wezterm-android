[package]
name = "battery"
version = "0.1.0"
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow.workspace = true
config.workspace = true
luahelper.workspace = true
wezterm-dynamic.workspace = true

# starship-battery has no Android backend and fails with a compile_error!.
# A real implementation would read /sys/class/power_supply or go through
# BatteryManager over JNI.
[target.'cfg(not(target_os = "android"))'.dependencies]
starship-battery.workspace = true
